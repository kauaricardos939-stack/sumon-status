<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumon Assistente</title>
<style>
  :root{
    --white:#ffffff;
    --bg:#eef1f0;
    --panel-border:#e2e6e3;
    --shadow:rgba(30,50,30,0.14);
    --text:#1c1f1c;
    --text-dim:#6c746e;
    --text-faint:#9aa39c;
    --green:#79c93c;
    --green-bright:#a6ff4d;
    --green-dark:#4f8f22;
    --green-glow:rgba(122,201,60,0.55);
    --idle:#c7ccc8;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(126,211,60,0.16), transparent 65%),
      linear-gradient(180deg, #fbfcfb 0%, var(--bg) 100%);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .blade{
    position:relative;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, #ffffff 0%, #f6f8f6 100%);
    border:1px solid var(--panel-border);
    border-radius:26px;
    padding:38px 34px 30px;
    box-shadow:
      0 30px 50px -28px var(--shadow),
      0 1px 0 rgba(255,255,255,0.9) inset;
    overflow:hidden;
  }

  .blade::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:130px;
    background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
    pointer-events:none;
  }

  .eyebrow{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:26px;
  }

  .badge{
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--green-dark);
    background:rgba(126,211,60,0.12);
    border:1px solid rgba(126,211,60,0.35);
    padding:4px 10px;
    border-radius:20px;
  }

  h1{
    position:relative;
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }

  .accent-rule{
    width:34px;
    height:4px;
    border-radius:4px;
    background:linear-gradient(90deg, var(--green), var(--green-bright));
    margin:0 0 16px;
  }

  .sub{
    position:relative;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.6;
    margin:0 0 28px;
    max-width:36ch;
  }

  /* Ring of light */
  .status-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:6px 0 28px;
  }

  .ring-shell{
    position:relative;
    width:116px;
    height:116px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring-of-light{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    background:#fdfefd;
    box-shadow:
      inset 0 0 0 2px #e6eae6,
      0 6px 18px -8px rgba(0,0,0,0.18);
    transform:rotate(0deg);
  }

  .quad{
    opacity:.14;
    transition:opacity .5s ease, filter .5s ease;
    filter:grayscale(0);
  }
  .q1{ background:radial-gradient(circle at 0% 0%, var(--green-bright), rgba(126,211,60,0) 72%); }
  .q2{ background:radial-gradient(circle at 100% 0%, var(--green-bright), rgba(126,211,60,0) 72%); }
  .q3{ background:radial-gradient(circle at 0% 100%, var(--green-bright), rgba(126,211,60,0) 72%); }
  .q4{ background:radial-gradient(circle at 100% 100%, var(--green-bright), rgba(126,211,60,0) 72%); }

  .ring-core{
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #eef1ee 65%, #e4e8e4 100%);
    box-shadow:
      0 2px 6px rgba(0,0,0,0.12),
      inset 0 1px 1px rgba(255,255,255,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--idle);
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition:background .4s ease, box-shadow .4s ease;
  }

  #status{
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--text-dim);
  }

  /* estado: verificando */
  .state-checking .q1{ animation:acender 1.6s ease-in-out infinite; animation-delay:0s; }
  .state-checking .q2{ animation:acender 1.6s ease-in-out infinite; animation-delay:.15s; }
  .state-checking .q4{ animation:acender 1.6s ease-in-out infinite; animation-delay:.3s; }
  .state-checking .q3{ animation:acender 1.6s ease-in-out infinite; animation-delay:.45s; }
  .state-checking .ring-dot{ background:var(--green); box-shadow:0 0 10px var(--green-glow); animation:pulse 1.6s ease-in-out infinite; }

  @keyframes acender{
    0%,60%,100%{ opacity:.14; }
    30%{ opacity:1; }
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.2); opacity:.7; }
  }
  @keyframes ripple{
    0%{ box-shadow:0 0 0 0 var(--green-glow); }
    100%{ box-shadow:0 0 0 16px rgba(126,211,60,0); }
  }

  /* estado: online */
  .state-online .quad{ opacity:1; }
  .state-online .ring-dot{
    background:var(--green);
    box-shadow:0 0 14px var(--green-glow);
    animation:ripple 1.8s ease-out infinite;
  }
  .state-online #status{ color:var(--green-dark); }

  /* estado: offline */
  .state-offline .quad{ opacity:.1; filter:grayscale(1); }
  .state-offline .ring-dot{ background:var(--idle); box-shadow:none; }
  .state-offline #status{ color:var(--text-faint); }

  @media (prefers-reduced-motion: reduce){
    .quad, .ring-dot{ animation:none !important; }
  }

  button#acessar{
    position:relative;
    width:100%;
    font-size:14px;
    font-weight:700;
    letter-spacing:.02em;
    color:#ffffff;
    background:linear-gradient(180deg, var(--green-bright), var(--green) 55%, var(--green-dark));
    border:none;
    border-radius:999px;
    padding:15px 20px;
    cursor:pointer;
    box-shadow:
      0 12px 22px -10px rgba(79,143,34,0.55),
      inset 0 1px 0 rgba(255,255,255,0.55);
    transition:transform .15s ease, box-shadow .25s ease, filter .25s ease;
  }
  button#acessar:hover{ transform:translateY(-1px); filter:brightness(1.04); }
  button#acessar:active{ transform:translateY(0); }

  .state-checking button#acessar{
    background:linear-gradient(180deg, #ffffff, #eef1ee);
    color:var(--text-faint);
    box-shadow:inset 0 0 0 1px var(--panel-border);
    cursor:progress;
  }

  .state-offline button#acessar{
    background:linear-gradient(180deg, #ffffff, #eef1ee);
    color:var(--text-dim);
    box-shadow:inset 0 0 0 1px var(--panel-border);
  }
  .state-offline button#acessar:hover{ filter:none; background:linear-gradient(180deg, #ffffff, #e9ede9); }

  .foot{
    position:relative;
    margin-top:18px;
    text-align:center;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--text-faint);
  }
</style>
</head>
<body>

  <main class="blade" id="card">

    <div class="eyebrow">
      <span>Sumon · Terminal de acesso</span>
      <span class="badge">Pré-alpha</span>
    </div>

    <h1>Sumon Assistente</h1>
    <div class="accent-rule"></div>
    <p class="sub">
      Esta versão pode apresentar erros, instabilidades
      ou indisponibilidade.
    </p>

    <div class="status-wrap state-checking" id="statusWrap">
      <div class="ring-shell">
        <div class="ring-of-light">
          <div class="quad q1"></div>
          <div class="quad q2"></div>
          <div class="quad q3"></div>
          <div class="quad q4"></div>
        </div>
        <div class="ring-core">
          <div class="ring-dot"></div>
        </div>
      </div>
      <p id="status">Verificando servidor...</p>
    </div>

    <button id="acessar">Aguardando sinal…</button>

    <p class="foot">Conexão verificada automaticamente a cada 30s</p>

  </main>

  <script>
    // URL do status.json publicado no repositório GitHub (Raw)
    const SUMON_STATUS_URL =
        "https://raw.githubusercontent.com/kauaricardos939-stack/sumon-status/main/status.json";

    // Variável que guarda o endereço atual do Cloudflare Tunnel (não exibida ao usuário)
    let sumonServerUrl = null;

    const statusWrap = document.getElementById("statusWrap");
    const statusEl = document.getElementById("status");
    const botao = document.getElementById("acessar");

    function setEstado(estado){
        statusWrap.classList.remove("state-checking", "state-online", "state-offline");
        statusWrap.classList.add(estado);
    }

    function marcarVerificando(){
        setEstado("state-checking");
        statusEl.textContent = "Verificando servidor...";
        botao.textContent = "Aguardando sinal…";
        botao.onclick = null;
    }

    function marcarIndisponivel(mensagem){
        sumonServerUrl = null;
        setEstado("state-offline");
        statusEl.textContent = "Sumon Assistente indisponível";
        botao.textContent = "Servidor indisponível";
        botao.onclick = () => {
            alert(mensagem || "O servidor do Sumon Assistente está desligado no momento. Tente novamente mais tarde.");
        };
    }

    function marcarDisponivel(url){
        sumonServerUrl = url;
        setEstado("state-online");
        statusEl.textContent = "Sumon Assistente disponível";
        botao.textContent = "Entrar no Sumon Assistente";
        botao.onclick = () => {
            if (sumonServerUrl) {
                window.location.href = sumonServerUrl;
            }
        };
    }

    async function checkSumonServer() {
        marcarVerificando();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000); // timeout de 8s

        try {
            const resposta = await fetch(
                SUMON_STATUS_URL + "?t=" + Date.now(),
                {
                    cache: "no-store",
                    signal: controller.signal
                }
            );

            clearTimeout(timeoutId);

            if (!resposta.ok) {
                throw new Error("Falha ao acessar status.json");
            }

            let dados;
            try {
                dados = await resposta.json();
            } catch {
                throw new Error("JSON inválido");
            }

            if (dados && dados.online === true && typeof dados.url === "string" && dados.url.trim() !== "") {
                marcarDisponivel(dados.url);
            } else {
                marcarIndisponivel();
            }

        } catch (erro) {
            clearTimeout(timeoutId);
            // Cobre erros de CORS, timeout (AbortError), rede e JSON inválido
            marcarIndisponivel();
        }
    }

    checkSumonServer();
    setInterval(checkSumonServer, 30000); // nova verificação a cada 30 segundos
  </script>

</body>
</html>
